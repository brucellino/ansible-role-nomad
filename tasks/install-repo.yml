- name: Ensure prerequisites
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ prerequisites[ansible_facts['distribution'] | lower] }}"

- name: Ensure Nomad is present
  ansible.builtin.package:
    name: nomad
    state: present

- name: Ensure Nomad Host volumes
  ansible.builtin.file:
    path: "{{ nomad_host_volume_dir }}/{{ item.path }}"
    mode: "0644"
    owner: root
    group: root
    state: directory
  loop: "{{ nomad_host_volumes }}"

- name: Ensure Nomad data directory
  ansible.builtin.file:
    path: "{{ nomad_data_dir }}"
    state: directory
    mode: "0777"
    owner: root
    group: root

- name: Ensure Nomad plugin directory
  ansible.builtin.file:
    path: "{{ nomad_data_dir }}/plugins"
    state: directory
    mode: "0777"
    owner: root
    group: root

- name: Ensure Nomad configuration directory
  ansible.builtin.file:
    path: "{{ nomad_config_dir }}"
    state: directory
    mode: "0744"
    owner: root
    group: root

- name: Template Nomad config
  ansible.builtin.template:
    src: etc/nomad.d/{{ item }}.j2
    dest: "{{ nomad_config_dir }}/{{ item }}"
    mode: "0644"
    owner: "{{ (server | bool) | ternary('nomad', 'root') }}"
    group: "{{ (server | bool) | ternary('nomad', 'root') }}"
    newline_sequence: \n
    block_start_string: "[%"
    block_end_string: "%]"
    variable_start_string: "[["
    variable_end_string: "]]"
  loop:
    - nomad.hcl
    - vault.hcl
    - ui.hcl

- name: Template Nomad Logrotate Entry
  ansible.builtin.template:
    src: etc/logrotate.d/nomad
    dest: /etc/logrotate.d/nomad
    mode: "0644"
    owner: root
    group: root
  notify: Restart logrotate

- name: Template systemd unit
  ansible.builtin.template:
    src: etc/systemd/system/nomad.service.j2
    dest: /etc/systemd/system/nomad.service
    block_start_string: "[%"
    block_end_string: "%]"
    mode: "0644"
    owner: root
    group: root
  notify: Reload service

- name: Ensure nomad service
  ansible.builtin.systemd:
    name: nomad
    state: restarted
    enabled: true
    daemon_reload: true
